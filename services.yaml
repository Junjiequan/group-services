# yaml-language-server: $schema=./services.schema.json
#
# Single source of truth for the dashboard. Edit this file, reload the page.
# Only `name` is required per project; every other field is optional and
# simply isn't rendered when missing. `logo` can be a URL or a local path
# (e.g. logos/scicat.svg); without one, the project's initials are shown.

group:
  name: SIMS TEAM
  description: Services and projects maintained by the team.

projects:
- id: useroffice
  name: User Office
  logo: https://github.com/UserOfficeProject.png
  description: >-
    Proposal submission, review, scheduling and experiment management for user facilities.
  tags: [ proposals, scheduling, graphql ]
  website: https://staging.useroffice.ess.eu/
  docs: https://userofficeproject.github.io/user-office-core/develop/
  contacts:
  - name: SIMS TEAM
    role: Maintainer
    email: todo@example.org
  repositories:
  - name: user-office-core
    url: https://github.com/UserOfficeProject/user-office-core
  - name: connector
    url: https://github.com/UserOfficeProject/connector
  - name: user-office-scheduler
    url: https://github.com/UserOfficeProject/user-office-scheduler
  - name: user-office-factory
    url: https://github.com/UserOfficeProject/user-office-factory
  - name: user-office-helm
    url: https://github.com/UserOfficeProject/user-office-helm
  links:
  - label: Staging
    url: https://staging.useroffice.ess.eu/
  - label: Production
    url: https://useroffice.ess.eu/

- id: scicat
  name: SciCat
  logo: https://github.com/SciCatProject.png
  description: >-
    Scientific metadata catalogue for managing datasets across their lifecycle, from acquisition to publication.
  tags: [ metadata, datasets, catalogue ]
  website: https://staging.scicat.ess.eu
  docs: https://www.scicatproject.org
  contacts:
  - name: SIMS TEAM
    role: Maintainer
    email: todo@example.org
  repositories:
  - name: backend
    url: https://github.com/SciCatProject/backend
  - name: frontend
    url: https://github.com/SciCatProject/frontend
  - name: scicatlive
    url: https://github.com/SciCatProject/scicatlive
  - name: scicat-ingestor
    url: https://github.com/SciCatProject/scicat-ingestor
  - name: scicat-helm
    url: https://github.com/SciCatProject/scicat-helm
  links:
  - label: Staging
    url: https://staging.scicat.ess.eu
  - label: Production
    url: https://scicat.ess.eu
