<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Group Services</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
    />
    <link rel="stylesheet" href="styles.css" />
    <script
      src="https://cdnjs.cloudflare.com/ajax/libs/js-yaml/4.1.0/js-yaml.min.js"
      defer
    ></script>
    <script src="app.js" defer></script>
  </head>
  <body>
    <header>
      <h1 id="group-name">SIMS TEAM</h1>
      <p id="group-description"></p>
      <input
        id="search"
        type="search"
        placeholder="Search projects, tags, people, repos…"
        autocomplete="off"
        aria-label="Search projects"
      />
    </header>
    <main id="projects" aria-live="polite"></main>
    <p id="empty" class="muted" hidden>No matching projects.</p>
  </body>
</html>
